<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rogue Tap - Add to Contacts</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --lime: #d4f900;
    --black: #111111;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--black);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #1a1a1a;
    border-radius: 18px;
    padding: 28px 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    text-align: center;
  }
  .brand {
    display: inline-block;
    background: var(--lime);
    color: var(--black);
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 18px;
    text-transform: uppercase;
  }
  h1 {
    font-size: 22px;
    margin: 4px 0 2px;
  }
  .title {
    color: #b7b7b7;
    font-size: 14px;
    margin: 0 0 2px;
  }
  .company {
    color: var(--lime);
    font-weight: 600;
    font-size: 15px;
    margin: 0 0 18px;
  }
  .field {
    text-align: left;
    font-size: 14px;
    padding: 8px 0;
    border-top: 1px solid #2a2a2a;
    color: #e6e6e6;
  }
  .field span {
    color: #888;
    display: inline-block;
    width: 64px;
  }
  .field.icon-field {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .field.icon-field svg {
    flex: none;
    border-radius: 6px;
  }
  .field.icon-field a {
    color: #e6e6e6;
    text-decoration: none;
    word-break: break-all;
  }
  .add-btn {
    display: block;
    width: 100%;
    margin-top: 22px;
    padding: 14px 0;
    background: var(--lime);
    color: var(--black);
    font-weight: 700;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    text-decoration: none;
    cursor: pointer;
  }
  .socials {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
  }
  .socials a {
    display: inline-flex;
    line-height: 0;
  }
  .socials a svg {
    border-radius: 9px;
  }
  .empty {
    color: #999;
    font-size: 14px;
    line-height: 1.5;
  }
  .footer {
    margin-top: 22px;
    color: #555;
    font-size: 11px;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="brand">Rogue Tap</div>
    <div id="content"><p class="empty">Loading contact...</p></div>
  </div>

<script>
function qp(name) {
  // URLSearchParams.get() already fully decodes the value - it must NOT
  // be passed through decodeURIComponent() again. Doing that turned out
  // to be a real bug: for any field containing a stray "%" (a website
  // URL, a social link, a company name with a percent sign in it), the
  // extra decode pass either corrupted the value or threw a URIError
  // that silently killed the rest of this script - which is exactly
  // what broke the "Add to Contacts" button for real customer cards.
  const v = new URLSearchParams(window.location.search).get(name);
  return v || "";
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Small logo badges used instead of text labels next to link fields -
// same look as the desktop app's icon badges, drawn inline so the page
// stays a single self-contained file with no extra image requests.
const ICONS = {
  website: `<svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="12" fill="#37474F"/><circle cx="12" cy="12" r="7" fill="none" stroke="#fff" stroke-width="1.3"/><line x1="5" y1="12" x2="19" y2="12" stroke="#fff" stroke-width="1.3"/><ellipse cx="12" cy="12" rx="3" ry="7" fill="none" stroke="#fff" stroke-width="1.3"/></svg>`,
  roguetap: `<svg viewBox="0 0 24 24" width="22" height="22"><rect width="24" height="24" rx="5" fill="#111111"/><path d="M6.5 15.2 A7 7 0 0 1 17.5 15.2" fill="none" stroke="#d4f900" stroke-width="1.6"/><path d="M8.7 17.3 A4.2 4.2 0 0 1 15.3 17.3" fill="none" stroke="#e6e6e6" stroke-width="1.6"/><circle cx="12" cy="18.6" r="1.3" fill="#d4f900"/></svg>`,
  facebook: `<svg viewBox="0 0 24 24" width="22" height="22"><rect width="24" height="24" rx="5" fill="#1877F2"/><text x="12" y="17.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">f</text></svg>`,
  instagram: `<svg viewBox="0 0 24 24" width="22" height="22"><rect width="24" height="24" rx="5" fill="#C13584"/><rect x="5" y="6" width="14" height="12" rx="3" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="12" r="3.4" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="16" cy="8" r="1" fill="#fff"/></svg>`,
  linkedin: `<svg viewBox="0 0 24 24" width="22" height="22"><rect width="24" height="24" rx="5" fill="#0A66C2"/><text x="12" y="16.5" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">in</text></svg>`,
};

const fields = {
  name: qp("n"),
  title: qp("t"),
  company: qp("c"),
  mobile: qp("m"),
  phone: qp("p"), // legacy single-phone param, kept for any older cards
  email: qp("e"),
  website: qp("w"),
  roguetap: qp("r"),
  facebook: qp("f"),
  instagram: qp("i"),
  linkedin: qp("l"),
};

const content = document.getElementById("content");

if (!fields.name) {
  // No card data in the URL - this is someone visiting the domain
  // directly (not tapping a card), so send them to the sales page
  // instead of showing a dead-end message.
  window.location.href = "home.html";
} else {
  let html = "";
  html += `<h1>${escapeHtml(fields.name)}</h1>`;
  if (fields.title) html += `<p class="title">${escapeHtml(fields.title)}</p>`;
  if (fields.company) html += `<p class="company">${escapeHtml(fields.company)}</p>`;

  // Show a single phone line instead of separate Mobile/Phone rows - a
  // card only ever has one number that matters to whoever's reading it.
  // "mobile" is the current field; "phone" is the older legacy param,
  // kept only so cards written before the mobile/phone split still show
  // their number. If somehow both are present, mobile wins.
  const phoneNumber = fields.mobile || fields.phone;
  if (phoneNumber) html += `<div class="field"><span>Phone</span>${escapeHtml(phoneNumber)}</div>`;
  if (fields.email) html += `<div class="field"><span>Email</span>${escapeHtml(fields.email)}</div>`;
  if (fields.website) html += `<div class="field icon-field">${ICONS.website}<a href="${escapeHtml(fields.website)}" target="_blank" rel="noopener">${escapeHtml(fields.website)}</a></div>`;

  html += `<a class="add-btn" id="addBtn" href="#">+ Add to Contacts</a>`;

  let socials = "";
  if (fields.roguetap) socials += `<a href="${escapeHtml(fields.roguetap)}" target="_blank" rel="noopener" aria-label="Rogue Tap">${ICONS.roguetap}</a>`;
  if (fields.facebook) socials += `<a href="${escapeHtml(fields.facebook)}" target="_blank" rel="noopener" aria-label="Facebook">${ICONS.facebook}</a>`;
  if (fields.instagram) socials += `<a href="${escapeHtml(fields.instagram)}" target="_blank" rel="noopener" aria-label="Instagram">${ICONS.instagram}</a>`;
  if (fields.linkedin) socials += `<a href="${escapeHtml(fields.linkedin)}" target="_blank" rel="noopener" aria-label="LinkedIn">${ICONS.linkedin}</a>`;
  if (socials) html += `<div class="socials">${socials}</div>`;

  content.innerHTML = html;

  // Build the vCard text and wire up the Add to Contacts link.
  //
  // This whole block is wrapped in try/catch on purpose: it previously
  // wasn't, and a single malformed field elsewhere in this script once
  // took the entire page down silently. Whatever happens with the vCard,
  // the rest of the page (name, company, socials) must stay usable.
  try {
    const lines = ["BEGIN:VCARD", "VERSION:3.0"];
    lines.push(`FN:${fields.name}`);
    if (fields.company) lines.push(`ORG:${fields.company}`);
    if (fields.title) lines.push(`TITLE:${fields.title}`);
    if (phoneNumber) lines.push(`TEL;TYPE=CELL:${phoneNumber}`);
    if (fields.email) lines.push(`EMAIL:${fields.email}`);
    if (fields.website) lines.push(`URL;TYPE=Website:${fields.website}`);
    if (fields.roguetap) lines.push(`URL;TYPE=RogueTap:${fields.roguetap}`);
    if (fields.facebook) lines.push(`URL;TYPE=Facebook:${fields.facebook}`);
    if (fields.instagram) lines.push(`URL;TYPE=Instagram:${fields.instagram}`);
    if (fields.linkedin) lines.push(`URL;TYPE=LinkedIn:${fields.linkedin}`);
    lines.push("END:VCARD");
    const vcard = lines.join("\r\n");

    // A Blob URL, not a data: URI. Real iOS Safari has been reported to
    // silently do nothing when a user taps an <a href="data:..."> link -
    // no error, no navigation, the button just looks dead, which matches
    // exactly what was reported. A Blob URL is the standard, reliable
    // cross-browser way to hand the browser a file to act on instead.
    const vcardBlob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
    const blobUrl = URL.createObjectURL(vcardBlob);
    const safeFileName = fields.name.replace(/[^a-z0-9]+/gi, "_") || "contact";
    const addBtn = document.getElementById("addBtn");
    addBtn.setAttribute("href", blobUrl);

    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    // The "download" attribute is what makes Android's browser save the
    // vCard and offer to add it to Contacts - but on iOS, Safari doesn't
    // support that attribute the same way: instead of opening its native
    // "Create New Contact" screen, it just saves the raw .vcf file into
    // the Files app and stops there, which looks like tapping the button
    // did nothing. Leaving the attribute off entirely on iOS is what lets
    // Safari open the vCard in its own contact-preview sheet instead.
    if (!isIOS) {
      addBtn.setAttribute("download", safeFileName + ".vcf");
    }

    // Android: auto-trigger the contact download the instant the page
    // opens, so tapping the card is the only tap needed - no button press.
    // iPhone deliberately keeps the manual button below instead of this -
    // Safari generally blocks a file download that isn't the direct result
    // of a user's own tap on a link, so an auto-trigger there would
    // silently fail rather than save a tap. This mirrors how both OSes
    // already only honour the tag's first record: same idea, applied to
    // this one extra step instead of a second NFC record.
    const isAndroid = /Android/i.test(navigator.userAgent);
    if (isAndroid) {
      setTimeout(() => addBtn.click(), 60);
    }
  } catch (err) {
    // Don't let a vCard-building failure take the rest of the page with
    // it - the name/company/socials above still render fine either way.
    console.error("Rogue Tap: failed to build Add to Contacts vCard", err);
  }
}
</script>
</body>
</html>
